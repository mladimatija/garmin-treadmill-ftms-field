name: Set up the Connect IQ SDK
description: >-
  Installs the Connect IQ SDK Manager CLI, the pinned SDK and the device files, and puts monkeyc
  on the PATH. Used by the CI compile check and the release build.

inputs:
  garmin-username:
    description: Garmin account used to download the SDK (no two-step verification)
    required: true
  garmin-password:
    description: Password of that account
    required: true
  devices:
    description: Device ids separated by spaces; empty = every watch in manifest.xml
    default: ""
  # Pinned versions. CONNECTIQ agreement hash = MD5 of the SDK licence agreement that was read and
  # accepted. When Garmin changes the agreement the build stops at "accept": read the new one with
  # `connect-iq-sdk-manager agreement view` and update this hash.
  sdk-version:
    description: Connect IQ SDK version
    default: 9.3.0
  sdk-manager-version:
    description: connect-iq-sdk-manager-cli release
    default: 0.8.4
  sdk-manager-sha256:
    description: SHA-256 of that release's Linux x86_64 archive
    default: 5d57b8f9cfcd02d3b3f48e19d6daca0480e4c6f627926f15d8617ef8a6f57e0b
  agreement-hash:
    description: MD5 of the accepted Connect IQ SDK licence agreement
    default: CC737BBBA104D7740D5BBCF27D0F6382

runs:
  using: composite
  steps:
    - name: Install Connect IQ SDK Manager CLI
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        SDK_MANAGER_VERSION: ${{ inputs.sdk-manager-version }}
        SDK_MANAGER_SHA256: ${{ inputs.sdk-manager-sha256 }}
      run: |
        archive="connect-iq-sdk-manager-cli_${SDK_MANAGER_VERSION}_Linux_x86_64.tar.gz"
        curl -fsSLO "https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v${SDK_MANAGER_VERSION}/${archive}"
        echo "${SDK_MANAGER_SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "$archive" connect-iq-sdk-manager
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Install Connect IQ SDK and device files
      shell: bash
      env:
        GARMIN_USERNAME: ${{ inputs.garmin-username }}
        GARMIN_PASSWORD: ${{ inputs.garmin-password }}
        CONNECTIQ_SDK_VERSION: ${{ inputs.sdk-version }}
        CONNECTIQ_AGREEMENT_HASH: ${{ inputs.agreement-hash }}
        DEVICES: ${{ inputs.devices }}
      run: |
        connect-iq-sdk-manager agreement accept --agreement-hash "$CONNECTIQ_AGREEMENT_HASH"
        connect-iq-sdk-manager login
        connect-iq-sdk-manager sdk set "$CONNECTIQ_SDK_VERSION"
        if [[ -n "$DEVICES" ]]; then
          args=()
          for d in $DEVICES; do
            args+=(--device "$d")
          done
          connect-iq-sdk-manager device download "${args[@]}"
        else
          connect-iq-sdk-manager device download --manifest manifest.xml
        fi
        connect-iq-sdk-manager sdk current-path --bin >> "$GITHUB_PATH"
