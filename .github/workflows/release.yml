name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CONNECTIQ_SDK_VERSION: 9.3.0
  SDK_MANAGER_VERSION: 0.8.4
  SDK_MANAGER_SHA256: 5d57b8f9cfcd02d3b3f48e19d6daca0480e4c6f627926f15d8617ef8a6f57e0b
  # MD5 of the Connect IQ SDK licence agreement that was read and accepted. When Garmin changes
  # the agreement the build stops at "accept": read the new one with
  # `connect-iq-sdk-manager agreement view` and update this hash.
  CONNECTIQ_AGREEMENT_HASH: CC737BBBA104D7740D5BBCF27D0F6382

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag and secrets
        env:
          HAS_KEY: ${{ secrets.CONNECTIQ_DEVELOPER_KEY != '' }}
          HAS_LOGIN: ${{ secrets.GARMIN_USERNAME != '' && secrets.GARMIN_PASSWORD != '' }}
        run: |
          version=$(sed -n 's/.*<iq:application .* version="\([^"]*\)".*/\1/p' manifest.xml)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in manifest.xml ($version)"
            exit 1
          fi
          if [[ "$HAS_KEY" != true || "$HAS_LOGIN" != true ]]; then
            echo "::error::Set the CONNECTIQ_DEVELOPER_KEY, GARMIN_USERNAME and GARMIN_PASSWORD secrets"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Connect IQ SDK Manager CLI
        working-directory: ${{ runner.temp }}
        run: |
          archive="connect-iq-sdk-manager-cli_${SDK_MANAGER_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v${SDK_MANAGER_VERSION}/${archive}"
          echo "${SDK_MANAGER_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" connect-iq-sdk-manager
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install Connect IQ SDK and device files
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          connect-iq-sdk-manager agreement accept --agreement-hash "$CONNECTIQ_AGREEMENT_HASH"
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set "$CONNECTIQ_SDK_VERSION"
          connect-iq-sdk-manager device download --manifest manifest.xml
          connect-iq-sdk-manager sdk current-path --bin >> "$GITHUB_PATH"

      - name: Write signing key
        env:
          CONNECTIQ_DEVELOPER_KEY: ${{ secrets.CONNECTIQ_DEVELOPER_KEY }}
        run: |
          umask 077
          base64 -d <<< "$CONNECTIQ_DEVELOPER_KEY" > "$RUNNER_TEMP/developer_key.der"
          echo "DEVELOPER_KEY=$RUNNER_TEMP/developer_key.der" >> "$GITHUB_ENV"

      - name: Build every watch
        run: ./build.sh

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: bin/build/*/build.log
          if-no-files-found: ignore

      - name: Package
        run: |
          name="FtmsTreadmill-$VERSION"
          mkdir -p "dist/$name"
          cp bin/FtmsTreadmill-*.prg LICENSE.md "dist/$name/"
          cd dist
          zip -qr "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"
          echo "ZIP=dist/$name.zip" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          One \`.prg\` per watch: find your watch's device id in the
          [supported watches](https://github.com/${GITHUB_REPOSITORY}#supported-watches) list and copy
          \`FtmsTreadmill-<device id>.prg\` from the zip into \`GARMIN/Apps/\` on the watch.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
