name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Lint build.sh
        run: shellcheck build.sh

  # Compiles the Monkey C for one watch, so a source error shows up before a release tag.
  # Needs the Garmin login secrets to download the SDK; without them (forks, Dependabot) it is
  # skipped. Not run for tags: the release builds every watch anyway.
  compile:
    name: Compile (fenix7)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for the Garmin login
        id: login
        env:
          HAS_LOGIN: ${{ secrets.GARMIN_USERNAME != '' && secrets.GARMIN_PASSWORD != '' }}
        run: |
          echo "ok=$HAS_LOGIN" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_LOGIN" != true ]]; then
            echo "::notice::No GARMIN_USERNAME / GARMIN_PASSWORD secrets: compile check skipped"
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.login.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: ./.github/actions/setup-connectiq
        if: steps.login.outputs.ok == 'true'
        with:
          garmin-username: ${{ secrets.GARMIN_USERNAME }}
          garmin-password: ${{ secrets.GARMIN_PASSWORD }}
          devices: fenix7

      - name: Throwaway signing key
        if: steps.login.outputs.ok == 'true'
        run: |
          umask 077
          openssl genrsa 4096 2> /dev/null \
            | openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt -out "$RUNNER_TEMP/key.der"
          echo "DEVELOPER_KEY=$RUNNER_TEMP/key.der" >> "$GITHUB_ENV"

      - name: Compile
        if: steps.login.outputs.ok == 'true'
        run: ./build.sh fenix7

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compile-log
          path: bin/build/*/build.log
          if-no-files-found: ignore
